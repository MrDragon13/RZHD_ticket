server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Не кешировать разметку SPA — после деплоя всегда актуальный index и тема по умолчанию из скрипта.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Статический интерфейс терминала отдается напрямую nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксируем API на backend-контейнер. Так frontend может использовать
    # относительный путь /api, а ключ DeepSeek остается только на сервере.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
